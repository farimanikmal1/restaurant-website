<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="payment">

    <h2>Payment</h2>

    <p class="payment-text">
        Choose your payment method
    </p>

    <div class="payment-methods">

       <button class="payment-btn" onclick="payByCard()">
    💳 Credit / Debit Card
</button>

<button class="payment-btn" onclick="payByPayPal()">
    🅿️ PayPal
</button>

<button class="payment-btn" onclick="payByApple()">
    🍎 Apple Pay
</button>

<button class="payment-btn" onclick="payByGoogle()">
    🤖 Google Pay
</button>

<button class="payment-btn" onclick="cashOnDelivery()">
    💵 Cash On Delivery
</button>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
