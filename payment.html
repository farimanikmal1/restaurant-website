<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="payment">

    <h2>Payment</h2>

    <p class="payment-subtitel">

        Enter your card information
    </p>

    <form class="card-form" onsubmit="payNow(event)">

       <input type="text" placeholder="card Holder Name" required>
       <input type="text" placeholder="Card Number" maxlength="19" required>

       <div class="card-row">
        <input type="text" placeholder="MM/YY" required>
        <input type="password"
        placeholder="CVV"
        maxlength="3"
        required>
       </div>


       <div class="card-logos">
        <img src="images/Visa.jpg">
        <img src="images/Mastercard.jpg">
        <img src="images/Paypal.jpg">
        <img src="images/Apple pay.jpg">
        <img src="images/Googal pay.jpg">
       </div>
       <button type="submit" class="payment-btn">Pay Now</button>
</form>
</section>

<div id="paymentSuccess" class="success-modal">

    <div class="success-content">
        <h2>Payment Successful!</h2>

        <p> Thank you for your order 
            <br>
            Your order has been to the restaurant.
        </p>
        <button onclick="backHome()">Back to Home</button>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
