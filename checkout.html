<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Checkout</title>

        <link rel="stylesheet" href="style.css">

    </head>
    <body>
        <section class="checkout">
            <h2>Checkout</h2>
            <form class="checkout-form" onsubmit="submitOrder(event)">
                <h3>Customer information</h3>

                <div class="input-row">
                    <input type="text" placeholder="First Name" maxlength="50" required>

                    <input type="text" placeholder="Last Name" maxlength="50" required>
                </div>

                <input type="email" placeholder="example@email.com" maxlength="100" required>
                <input type="tel" placeholder="+49 15123456789" pattern="^\+?[0-9 ]{8,15}$" maxlength="15" required>

                <h3>Delivery Address </h3>
                <input type="text" placeholder="Street and House Number" maxlength="80" required>

                <input type="text" placeholder="Apartment (option)" maxlength="20">

                <div class="input-row">
                    <input type="text" placeholder="Postal Code (PLZ)" maxlength="5" pattern="[0-9]{5}" required>
                    <input type="text" placeholder="City" maxlength="50" required>

                </div>


                <select required>
                    <option value="">Select Country</option>
                    <option>Germany</option>
                    <option>Austria</option>
                    <option>Switzerland</option>
                </select>

                <div class="order-summary">
                <h3>Your Order</h3>

              <p>Total Items: <span id="totalItems">0</span></p>
                <h3>Total: <span id="totalPrice">0 €</span></h3>
               </div>

                <button type="submit">Place Order</button>
                </form>

<div id="successModal" class="success-modal">
    <div class="success-content">
        <div class="success-icon"></div>
        <h2>Order Submitted!</h2>
        <p>Thank you for your order
        <br>
        Your food will arrive in about 20-30 minutes.
        </p>
        <button onclick="closeModal()">
            Back to Home
        </button>
    </div>
</div>

        </section>
        <script src="script.js"></script>

        <script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let totalPrice = document.getElementById("totalPrice");
let totalItems = document.getElementById("totalItems");

let total = 0;
let items = 0;

cart.forEach(function(item){
    total += item.price * item.quantity;
    items += item.quantity;
});

totalItems.innerText = items;
totalPrice.innerText = total.toFixed(2) + " €";
</script>

    </body>
</html>
